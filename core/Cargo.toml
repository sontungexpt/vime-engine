[package]
name = "vime-engine"
version = "0.1.0"
edition = "2021"
description = "Frontend-independent Vietnamese input method engine"
license = "MIT"

[dependencies]

# The benches in this package are `harness = false` and drive their own
# best-of-N loop (see benches/support/mod.rs), so there are no benchmark
# dev-dependencies.

# Integration tests (tests/*.rs). Declared explicitly so helper
# subdirectories (e.g. tests/common/) never become targets.
[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "discriminants"
path = "tests/discriminants.rs"

[[test]]
name = "inline_vec"
path = "tests/inline_vec.rs"

[[test]]
name = "keymap"
path = "tests/keymap.rs"

[[test]]
name = "nucleus"
path = "tests/nucleus.rs"

[[test]]
name = "phonotactics"
path = "tests/phonotactics.rs"

[[test]]
name = "vowel"
path = "tests/vowel.rs"

# Benches (benches/*.rs). Declared explicitly, for the same reason as the
# tests: benches/support/ must not become a target.
[[bench]]
name = "bench_composition"
path = "benches/bench_composition.rs"
harness = false

[[bench]]
name = "bench_inline_vec"
path = "benches/bench_inline_vec.rs"
harness = false
